name: Daily rebuild and deploy

# Ogni giorno alle 0 e 10 UTC (il giorno del build è la data UTC, astro.config.mjs) : i calcoli partono da quel giorno e la pagina lo dice
# (« calcolato al … », anni alla scadenza), quindi il sito viene ricostruito e pubblicato ogni giorno.
# Nessuna fonte viene riletta qui : i parametri dei titoli si leggono a mano.
# Ce workflow est le seul qui publie le site : push sur main, tâche planifiée et lancement manuel.
# Modèle : canadaprocessingtimes.com/.github/workflows/update-data.yml (RECETTE, sites à données datées).
on:
  schedule:
    - cron: "10 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4
      - name: Ping IndexNow
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://btpnetto.it
